name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer commit replaces checks for the same branch/PR, never another ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  engine:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Verify native Rust compiler host
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$CARGO_BUILD_TARGET"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Use the activated native MSVC toolchain for CMake
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NMake uses cl.exe from msvc-dev-cmd, including native ARM64.
          # Do not assume a VS major version: ARM runners now ship VS 18.
          "CMAKE_GENERATOR=NMake Makefiles" >> $env:GITHUB_ENV
      - name: Verify native MSVC linker and Rust build-script linking
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command cl.exe -CommandType Application -ErrorAction Stop).Source
          $tools = Split-Path -Parent $compiler
          $native = Join-Path $tools 'link.exe'
          if ($compiler -notmatch '\\VC\\Tools\\MSVC\\' -or -not (Test-Path -LiteralPath $native -PathType Leaf)) {
            throw 'The activated native MSVC compiler/linker pair is missing'
          }
          $key = 'CARGO_TARGET_' + $env:CARGO_BUILD_TARGET.ToUpperInvariant().Replace('-', '_') + '_LINKER'
          "$key=$native" >> $env:GITHUB_ENV
          $tools >> $env:GITHUB_PATH
          Set-Item -Path "Env:$key" -Value $native
          $env:Path = "$tools;$env:Path"
          Write-Host "Native Rust linker: $native"
          $smoke = Join-Path $env:RUNNER_TEMP ('ulos-link-smoke-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path (Join-Path $smoke 'src') | Out-Null
          try {
            @('[package]', 'name = "ulos-link-smoke"', 'version = "0.0.0"', 'edition = "2024"', '[workspace]') | Set-Content -Encoding utf8 (Join-Path $smoke 'Cargo.toml')
            'fn main() {}' | Set-Content -Encoding utf8 (Join-Path $smoke 'build.rs')
            'fn main() {}' | Set-Content -Encoding utf8 (Join-Path $smoke 'src/main.rs')
            cargo build --offline --manifest-path (Join-Path $smoke 'Cargo.toml') --target $env:CARGO_BUILD_TARGET --target-dir (Join-Path $smoke 'target')
            if ($LASTEXITCODE -ne 0) { throw 'Native Rust build-script/application link smoke failed' }
          } finally {
            Remove-Item -LiteralPath $smoke -Recurse -Force
          }
      - name: Install pinned Inno Setup compiler (build tool only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = & ./scripts/install-inno-setup.ps1
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Missing ISCC compiler' }
          "ULOS_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Compile both Windows installers (synthetic native headers; no installation)
        if: runner.os == 'Windows'
        run: python3 scripts/smoke-windows-installer.py
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        continue-on-error: true
        with:
          shared-key: engine-${{ matrix.target }}
          cache-bin: false
          cache-targets: true
          cache-workspace-crates: false
          cache-on-failure: false
          env-vars: VCToolsVersion WindowsSDKVersion ImageOS ImageVersion
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      - name: Test release packager (synthetic headers)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  desktop:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - name: Verify native Rust compiler host
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$CARGO_BUILD_TARGET"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Use the activated native MSVC toolchain for CMake
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NMake uses cl.exe from msvc-dev-cmd, including native ARM64.
          # Do not assume a VS major version: ARM runners now ship VS 18.
          "CMAKE_GENERATOR=NMake Makefiles" >> $env:GITHUB_ENV
      - name: Verify native MSVC linker and Rust build-script linking
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command cl.exe -CommandType Application -ErrorAction Stop).Source
          $tools = Split-Path -Parent $compiler
          $native = Join-Path $tools 'link.exe'
          if ($compiler -notmatch '\\VC\\Tools\\MSVC\\' -or -not (Test-Path -LiteralPath $native -PathType Leaf)) {
            throw 'The activated native MSVC compiler/linker pair is missing'
          }
          $key = 'CARGO_TARGET_' + $env:CARGO_BUILD_TARGET.ToUpperInvariant().Replace('-', '_') + '_LINKER'
          "$key=$native" >> $env:GITHUB_ENV
          $tools >> $env:GITHUB_PATH
          Set-Item -Path "Env:$key" -Value $native
          $env:Path = "$tools;$env:Path"
          Write-Host "Native Rust linker: $native"
          $smoke = Join-Path $env:RUNNER_TEMP ('ulos-link-smoke-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path (Join-Path $smoke 'src') | Out-Null
          try {
            @('[package]', 'name = "ulos-link-smoke"', 'version = "0.0.0"', 'edition = "2024"', '[workspace]') | Set-Content -Encoding utf8 (Join-Path $smoke 'Cargo.toml')
            'fn main() {}' | Set-Content -Encoding utf8 (Join-Path $smoke 'build.rs')
            'fn main() {}' | Set-Content -Encoding utf8 (Join-Path $smoke 'src/main.rs')
            cargo build --offline --manifest-path (Join-Path $smoke 'Cargo.toml') --target $env:CARGO_BUILD_TARGET --target-dir (Join-Path $smoke 'target')
            if ($LASTEXITCODE -ne 0) { throw 'Native Rust build-script/application link smoke failed' }
          } finally {
            Remove-Item -LiteralPath $smoke -Recurse -Force
          }
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        continue-on-error: true
        with:
          shared-key: desktop-${{ matrix.target }}
          cache-bin: false
          cache-targets: true
          cache-workspace-crates: false
          cache-on-failure: false
          env-vars: VCToolsVersion WindowsSDKVersion ImageOS ImageVersion
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      - name: Identify native dependency cache
        if: runner.os == 'Windows'
        id: native-cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command cl.exe -CommandType Application -ErrorAction Stop).Source
          $linker = Join-Path (Split-Path -Parent $compiler) 'link.exe'
          $recipe = Get-Content -LiteralPath scripts/build-torrent-worker.py -Raw
          $baseline = [regex]::Match($recipe, "VCPKG_BASELINE = '([0-9a-f]{40})'").Groups[1].Value
          if (-not $baseline) { throw 'Missing pinned vcpkg baseline' }
          foreach ($name in @('VCToolsVersion', 'WindowsSDKVersion', 'ImageOS', 'ImageVersion', 'CARGO_BUILD_TARGET', 'RUNNER_ARCH')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing cache identity: $name" }
          }
          $identity = @('native-v1', $baseline, $env:CARGO_BUILD_TARGET, $env:RUNNER_ARCH,
            $env:VCToolsVersion, $env:WindowsSDKVersion, $env:ImageOS, $env:ImageVersion,
            (Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash,
            (Get-FileHash -LiteralPath $linker -Algorithm SHA256).Hash,
            (Get-FileHash -LiteralPath scripts/build-torrent-worker.py -Algorithm SHA256).Hash,
            (Get-FileHash -LiteralPath native/torrent-worker/CMakeLists.txt -Algorithm SHA256).Hash) -join "`n"
          $sha = [Security.Cryptography.SHA256]::Create()
          try { $digest = [Convert]::ToHexString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant() }
          finally { $sha.Dispose() }
          $cache = Join-Path $env:GITHUB_WORKSPACE '.cache/ulos/vcpkg'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "path=$cache" >> $env:GITHUB_OUTPUT
          "key=ulos-native-v1-$env:RUNNER_ARCH-$baseline-$digest" >> $env:GITHUB_OUTPUT
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
      - name: Restore native dependency archives
        if: runner.os == 'Windows'
        id: restore-native
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}
      - name: Build and test bundled native torrent worker
        run: python3 scripts/build-torrent-worker.py --profile debug --test --install-deps
      - name: Save verified native dependency archives
        if: runner.os == 'Windows' && steps.restore-native.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}
      - name: Select native worker for Rust integration tests
        shell: bash
        run: |
          python3 - <<'PYWORKER'
          import os
          from pathlib import Path
          target = Path(os.environ.get('CARGO_TARGET_DIR', 'target')) / os.environ.get('CARGO_BUILD_TARGET', '') / 'debug'
          worker = target / ('ulos-torrent-worker.exe' if os.name == 'nt' else 'ulos-torrent-worker')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ULOS_TORRENT_WORKER=' + str(worker.resolve()) + '\n')
          PYWORKER
      - run: cargo check --locked -p ulos-desktop
      - name: Verify real v2 and hybrid task publication
        timeout-minutes: 5
        run: cargo test --locked -p ulos-core --test torrent_native_integration -- --ignored --test-threads=1
      - name: Compile desktop adapter tests
        timeout-minutes: 15
        run: cargo test --locked --workspace --no-run
      - name: Test desktop adapters (bounded; not native rendering evidence)
        timeout-minutes: 5
        run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
