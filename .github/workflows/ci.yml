name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  engine:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Verify native Rust compiler host
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$CARGO_BUILD_TARGET"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Use the activated native MSVC toolchain for CMake
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NMake uses cl.exe from msvc-dev-cmd, including native ARM64.
          # Do not assume a VS major version: ARM runners now ship VS 18.
          "CMAKE_GENERATOR=NMake Makefiles" >> $env:GITHUB_ENV
      - name: Install pinned Inno Setup compiler (build tool only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = & ./scripts/install-inno-setup.ps1
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Missing ISCC compiler' }
          "ULOS_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Compile both Windows installers (synthetic native headers; no installation)
        if: runner.os == 'Windows'
        run: python3 scripts/smoke-windows-installer.py
      - name: Test release packager (synthetic headers)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  desktop:
    # Windows also builds release-mode payloads and downloadable Setup artifacts.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - name: Verify native Rust compiler host
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$CARGO_BUILD_TARGET"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Use the activated native MSVC toolchain for CMake
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NMake uses cl.exe from msvc-dev-cmd, including native ARM64.
          # Do not assume a VS major version: ARM runners now ship VS 18.
          "CMAKE_GENERATOR=NMake Makefiles" >> $env:GITHUB_ENV
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Build and test bundled native torrent worker
        run: python3 scripts/build-torrent-worker.py --profile debug --test --install-deps
      - name: Select native worker for Rust integration tests
        shell: bash
        run: |
          python3 - <<'PYWORKER'
          import os
          from pathlib import Path
          target = Path(os.environ.get('CARGO_TARGET_DIR', 'target')) / os.environ.get('CARGO_BUILD_TARGET', '') / 'debug'
          worker = target / ('ulos-torrent-worker.exe' if os.name == 'nt' else 'ulos-torrent-worker')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ULOS_TORRENT_WORKER=' + str(worker.resolve()) + '\n')
          PYWORKER
      - run: cargo check --locked -p ulos-desktop
      - name: Verify real v2 and hybrid task publication
        timeout-minutes: 5
        run: cargo test --locked -p ulos-core --test torrent_native_integration -- --ignored --test-threads=1
      - name: Compile desktop adapter tests
        timeout-minutes: 15
        run: cargo test --locked --workspace --no-run
      - name: Test desktop adapters (bounded; not native rendering evidence)
        timeout-minutes: 5
        run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build Windows distribution payload
        if: runner.os == 'Windows'
        run: |
          python3 scripts/build-torrent-worker.py --profile release --test --install-deps
          cargo build --locked --release -p ulos-desktop
      - name: Build Windows Setup with license and notices pages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = & ./scripts/install-inno-setup.ps1
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Missing ISCC compiler' }
          $env:ULOS_ISCC = $compiler
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x86_64' }
          python3 scripts/release-package.py windows $arch $version
          if ($LASTEXITCODE -ne 0) { throw 'Setup packaging failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Ulos-Windows-${{ runner.arch }}-Setup
          path: dist/*-Setup.exe
          if-no-files-found: error
          retention-days: 7
