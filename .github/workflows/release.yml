name: Release Ulos

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag version, without v (for example 0.0.1-pre.2)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate existing tag and Cargo version
        id: identity
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid version'; exit 1; }
          tag="v$version"
          # Dispatch never manufactures a tag or releases its selected branch.
          git rev-parse --verify "refs/tags/$tag" >/dev/null
          commit=$(git rev-parse "refs/tags/$tag^{commit}")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$commit" == "$(git rev-parse HEAD)" ]]
          fi
          git checkout --detach "$commit"
          python3 scripts/release-version.py "$version"
          printf 'version=%s\ntag=%s\ncommit=%s\n' "$version" "$tag" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit hardware labels; macos-15 is Apple silicon, not Intel.
          - runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Use the activated native MSVC toolchain for CMake
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NMake uses cl.exe from msvc-dev-cmd, including native ARM64.
          # Do not assume a VS major version: ARM runners now ship VS 18.
          "CMAKE_GENERATOR=NMake Makefiles" >> $env:GITHUB_ENV
      - name: Verify native MSVC linker and Rust build-script linking
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command cl.exe -CommandType Application -ErrorAction Stop).Source
          $tools = Split-Path -Parent $compiler
          $native = Join-Path $tools 'link.exe'
          if ($compiler -notmatch '\\VC\\Tools\\MSVC\\' -or -not (Test-Path -LiteralPath $native -PathType Leaf)) {
            throw 'The activated native MSVC compiler/linker pair is missing'
          }
          $key = 'CARGO_TARGET_' + $env:CARGO_BUILD_TARGET.ToUpperInvariant().Replace('-', '_') + '_LINKER'
          "$key=$native" >> $env:GITHUB_ENV
          $tools >> $env:GITHUB_PATH
          Set-Item -Path "Env:$key" -Value $native
          $env:Path = "$tools;$env:Path"
          Write-Host "Native Rust linker: $native"
          $smoke = Join-Path $env:RUNNER_TEMP ('ulos-link-smoke-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path (Join-Path $smoke 'src') | Out-Null
          try {
            @('[package]', 'name = "ulos-link-smoke"', 'version = "0.0.0"', 'edition = "2024"', '[workspace]') | Set-Content -Encoding utf8 (Join-Path $smoke 'Cargo.toml')
            'fn main() {}' | Set-Content -Encoding utf8 (Join-Path $smoke 'build.rs')
            'fn main() {}' | Set-Content -Encoding utf8 (Join-Path $smoke 'src/main.rs')
            cargo build --offline --manifest-path (Join-Path $smoke 'Cargo.toml') --target $env:CARGO_BUILD_TARGET --target-dir (Join-Path $smoke 'target')
            if ($LASTEXITCODE -ne 0) { throw 'Native Rust build-script/application link smoke failed' }
          } finally {
            Remove-Item -LiteralPath $smoke -Recurse -Force
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - name: Verify version and native toolchain
        run: |
          python3 scripts/release-version.py "$RELEASE_VERSION"
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$CARGO_BUILD_TARGET"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        continue-on-error: true
        with:
          shared-key: release-build-${{ matrix.target }}
          cache-bin: false
          cache-targets: true
          cache-workspace-crates: false
          cache-on-failure: false
          env-vars: VCToolsVersion WindowsSDKVersion ImageOS ImageVersion
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      - name: Identify native dependency cache
        if: runner.os == 'Windows'
        id: native-cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command cl.exe -CommandType Application -ErrorAction Stop).Source
          $linker = Join-Path (Split-Path -Parent $compiler) 'link.exe'
          $recipe = Get-Content -LiteralPath scripts/build-torrent-worker.py -Raw
          $baseline = [regex]::Match($recipe, "VCPKG_BASELINE = '([0-9a-f]{40})'").Groups[1].Value
          if (-not $baseline) { throw 'Missing pinned vcpkg baseline' }
          foreach ($name in @('VCToolsVersion', 'WindowsSDKVersion', 'ImageOS', 'ImageVersion', 'CARGO_BUILD_TARGET', 'RUNNER_ARCH')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing cache identity: $name" }
          }
          $identity = @('native-v1', $baseline, $env:CARGO_BUILD_TARGET, $env:RUNNER_ARCH,
            $env:VCToolsVersion, $env:WindowsSDKVersion, $env:ImageOS, $env:ImageVersion,
            (Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash,
            (Get-FileHash -LiteralPath $linker -Algorithm SHA256).Hash,
            (Get-FileHash -LiteralPath scripts/build-torrent-worker.py -Algorithm SHA256).Hash,
            (Get-FileHash -LiteralPath native/torrent-worker/CMakeLists.txt -Algorithm SHA256).Hash) -join "`n"
          $sha = [Security.Cryptography.SHA256]::Create()
          try { $digest = [Convert]::ToHexString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant() }
          finally { $sha.Dispose() }
          $cache = Join-Path $env:GITHUB_WORKSPACE '.cache/ulos/vcpkg'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "path=$cache" >> $env:GITHUB_OUTPUT
          "key=ulos-native-v1-$env:RUNNER_ARCH-$baseline-$digest" >> $env:GITHUB_OUTPUT
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
      - name: Restore native dependency archives
        if: runner.os == 'Windows'
        id: restore-native
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}
      - name: Build and test bundled native torrent worker
        run: python3 scripts/build-torrent-worker.py --profile release --test --install-deps
      - name: Save verified native dependency archives
        if: runner.os == 'Windows' && steps.restore-native.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}
      - name: Select native worker for Rust integration tests
        shell: bash
        run: |
          python3 - <<'PYWORKER'
          import os
          from pathlib import Path
          target = Path(os.environ.get('CARGO_TARGET_DIR', 'target')) / os.environ.get('CARGO_BUILD_TARGET', '') / 'release'
          worker = target / ('ulos-torrent-worker.exe' if os.name == 'nt' else 'ulos-torrent-worker')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ULOS_TORRENT_WORKER=' + str(worker.resolve()) + '\n')
          PYWORKER
      - name: Test engine and CLI (serial fixtures; no native power-provider exercise)
        if: runner.os != 'Windows'
        run: cargo test --locked -p ulos-core -p ulos-cli -- --test-threads=1
      - name: Test engine and CLI (Windows native shell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --locked -p ulos-core -p ulos-cli -- --test-threads=1
      - name: Verify real v2 and hybrid task publication
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: cargo test --locked -p ulos-core --test torrent_native_integration -- --ignored --test-threads=1
      - name: Verify real v2 and hybrid task publication (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: cargo test --locked -p ulos-core --test torrent_native_integration -- --ignored --test-threads=1
      - name: Check desktop compilation
        if: runner.os != 'Windows'
        run: cargo check --locked -p ulos-desktop
      - name: Check desktop compilation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo check --locked -p ulos-desktop
      - name: Check strict lint
        if: runner.os != 'Windows'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check strict lint (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build desktop
        if: runner.os != 'Windows'
        run: cargo build --locked --release -p ulos-desktop
      - name: Build desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release -p ulos-desktop
      - name: Install pinned Inno Setup compiler (build tool only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = & ./scripts/install-inno-setup.ps1
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Missing ISCC compiler' }
          "ULOS_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Package desktop
        shell: python {0}
        env:
          ULOS_RELEASE_PLATFORM: ${{ matrix.platform }}
          ULOS_RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([
              sys.executable, 'scripts/release-package.py',
              os.environ['ULOS_RELEASE_PLATFORM'],
              os.environ['ULOS_RELEASE_ARCH'],
              os.environ['RELEASE_VERSION'],
          ], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*-Setup.exe
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  desktop-tests:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: arm64
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        continue-on-error: true
        with:
          shared-key: desktop-aarch64-apple-darwin
          cache-bin: false
          cache-targets: true
          cache-workspace-crates: false
          cache-on-failure: false
          env-vars: VCToolsVersion WindowsSDKVersion ImageOS ImageVersion
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      - name: Build and test bundled native torrent worker
        run: python3 scripts/build-torrent-worker.py --profile debug --test --install-deps
      - name: Select native worker for Rust integration tests
        shell: bash
        run: |
          python3 - <<'PYWORKER'
          import os
          from pathlib import Path
          target = Path(os.environ.get('CARGO_TARGET_DIR', 'target')) / os.environ.get('CARGO_BUILD_TARGET', '') / 'debug'
          worker = target / ('ulos-torrent-worker.exe' if os.name == 'nt' else 'ulos-torrent-worker')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ULOS_TORRENT_WORKER=' + str(worker.resolve()) + '\n')
          PYWORKER
      - run: cargo fmt --all -- --check
      - name: Compile desktop adapter tests
        timeout-minutes: 15
        run: cargo test --locked --workspace --no-run
      - name: Test desktop adapters (bounded)
        timeout-minutes: 5
        run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  publish:
    needs: [validate, build, desktop-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify asset set and generate SHA256SUMS
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected=("Ulos-$RELEASE_VERSION-macos-arm64.dmg" "Ulos-$RELEASE_VERSION-macos-x86_64.dmg" "Ulos-$RELEASE_VERSION-windows-x86_64-Setup.exe" "Ulos-$RELEASE_VERSION-linux-x86_64.tar.gz" "Ulos-$RELEASE_VERSION-windows-arm64-Setup.exe" "Ulos-$RELEASE_VERSION-linux-arm64.tar.gz")
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for asset in "${expected[@]}"; do test -s "$asset"; done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish normal release (including -pre version names)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          # --verify-tag forbids implicit tag creation. An existing release fails
          # rather than silently replacing published assets.
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Ulos ${RELEASE_TAG#v}" --draft=false --prerelease=false --latest \
            --notes-file RELEASE_NOTES.md
