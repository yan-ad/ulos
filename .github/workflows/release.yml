name: Release Ulos

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag version, without v (for example 0.0.1-pre.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate existing tag and Cargo version
        id: identity
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid version'; exit 1; }
          tag="v$version"
          # Dispatch never manufactures a tag or releases its selected branch.
          git rev-parse --verify "refs/tags/$tag" >/dev/null
          commit=$(git rev-parse "refs/tags/$tag^{commit}")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$commit" == "$(git rev-parse HEAD)" ]]
          fi
          git checkout --detach "$commit"
          python3 scripts/release-version.py "$version"
          printf 'version=%s\ntag=%s\ncommit=%s\n' "$version" "$tag" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit hardware labels; macos-15 is Apple silicon, not Intel.
          - runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - name: Verify version and native toolchain
        run: |
          python3 scripts/release-version.py "$RELEASE_VERSION"
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$CARGO_BUILD_TARGET"
      - name: Test engine and CLI (serial fixtures; no native power-provider exercise)
        run: cargo test --locked -p ulos-core -p ulos-cli -- --test-threads=1
      - name: Check desktop compilation and strict lint
        run: |
          cargo check --locked -p ulos-desktop
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build desktop
        run: cargo build --locked --release -p ulos-desktop
      - name: Package desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/release-package.py "$PLATFORM" "$ARCH" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  desktop-tests:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Compile desktop adapter tests
        timeout-minutes: 15
        run: cargo test --locked --workspace --no-run
      - name: Test desktop adapters (bounded)
        timeout-minutes: 5
        run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  publish:
    needs: [validate, build, desktop-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify asset set and generate SHA256SUMS
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected=("Ulos-$RELEASE_VERSION-macos-arm64.dmg" "Ulos-$RELEASE_VERSION-macos-x86_64.dmg" "Ulos-$RELEASE_VERSION-windows-x86_64.zip" "Ulos-$RELEASE_VERSION-linux-x86_64.tar.gz")
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          for asset in "${expected[@]}"; do test -s "$asset"; done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish normal release (including -pre version names)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          # --verify-tag forbids implicit tag creation. An existing release fails
          # rather than silently replacing published assets.
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Ulos ${RELEASE_TAG#v}" --draft=false --prerelease=false --latest \
            --notes-file RELEASE_NOTES.md
