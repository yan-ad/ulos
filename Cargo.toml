[workspace]
members = ["crates/ulos-core", "crates/ulos-cli", "crates/ulos-desktop"]
default-members = ["crates/ulos-core", "crates/ulos-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1-pre.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
ulos-core = { path = "crates/ulos-core" }
clap = { version = "4.6.7", features = ["derive"] }
gpui-kit = "=0.7.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "time"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
